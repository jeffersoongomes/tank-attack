<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tank Attack</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #121212;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 {
            color: #4CAF50;
            font-size: 22px;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        .scoreboard {
            font-size: 16px;
            margin-bottom: 15px;
            font-weight: bold;
        }
        canvas {
            border: 4px solid #fff;
            background-color: #e0e8d0;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.3);
        }
        .controls-hint {
            margin-top: 15px;
            font-size: 13px;
            color: #aaa;
            text-align: center;
        }
        .mobile-controls {
            display: none;
            margin-top: 15px;
            gap: 10px;
        }
        .btn-ctrl {
            background: #333;
            color: #fff;
            border: 2px solid #fff;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
        }
        .btn-ctrl:active {
            background: #4CAF50;
        }
        @media (max-width: 768px) {
            .mobile-controls {
                display: flex;
            }
        }
    </style>
</head>
<body>

    <h1>• TANK ATTACK • <span style="color: #888; font-size: 14px;">BY-@jeffersoongomes</span></h1>
    <div class="scoreboard">
        Vidas: <span id="lives">❤️❤️❤️</span> | Nível: <span id="level">1</span> | Pontos: <span id="score">0</span> | Recorde: <span id="highscore">0</span>
    </div>

    <canvas id="gameCanvas" width="500" height="500"></canvas>

    <div class="controls-hint">
        <b>WASD / Setas</b>: Mover | <b>Espaço / Clique</b>: Atirar
    </div>

    <div class="mobile-controls">
        <button class="btn-ctrl" onclick="movePlayer('UP')">⬆️</button>
        <button class="btn-ctrl" onclick="movePlayer('LEFT')">⬅️</button>
        <button class="btn-ctrl" onclick="movePlayer('RIGHT')">➡️</button>
        <button class="btn-ctrl" onclick="movePlayer('DOWN')">⬇️</button>
        <button class="btn-ctrl" onclick="shootBullet()" style="background: #b71c1c;">🔥 ATIRAR</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const scoreEl = document.getElementById('score');
        const highscoreEl = document.getElementById('highscore');
        const livesEl = document.getElementById('lives');
        const levelEl = document.getElementById('level');

        let score = 0;
        let highscore = localStorage.getItem('tank_highscore') || 0;
        highscoreEl.innerText = highscore;

        let lives = 3;
        let level = 1;
        let gameTime = 0;
        let gameOver = false;

        setInterval(() => {
            if (!gameOver) {
                gameTime++;
                if (gameTime % 60 === 0) {
                    level++;
                    levelEl.innerText = level;
                }
            }
        }, 1000);

        let player = {
            x: 235,
            y: 235,
            size: 32,
            speed: 3,
            dir: 'UP'
        };

        let bullets = [];
        let enemies = [];
        let enemyBullets = [];

        let keys = {};
        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            if (e.code === 'Space') {
                shootBullet();
                e.preventDefault();
            }
        });
        window.addEventListener('keyup', e => { keys[e.code] = false; });

        function movePlayer(direction) {
            player.dir = direction;
            if (direction === 'UP' && player.y > 0) player.y -= player.speed * 4;
            if (direction === 'DOWN' && player.y < canvas.height - player.size) player.y += player.speed * 4;
            if (direction === 'LEFT' && player.x > 0) player.x -= player.speed * 4;
            if (direction === 'RIGHT' && player.x < canvas.width - player.size) player.x += player.speed * 4;
        }

        function shootBullet() {
            if (gameOver) {
                resetGame();
                return;
            }

            let bx = 0, by = 0;
            let bdx = 0, bdy = 0;
            let speed = 7;
            let cx = player.x + player.size / 2;
            let cy = player.y + player.size / 2;

            if (player.dir === 'UP') { bx = cx - 3; by = player.y - 10; bdy = -speed; }
            else if (player.dir === 'DOWN') { bx = cx - 3; by = player.y + player.size; bdy = speed; }
            else if (player.dir === 'LEFT') { bx = player.x - 10; by = cy - 3; bdx = -speed; }
            else if (player.dir === 'RIGHT') { bx = player.x + player.size; by = cy - 3; bdx = speed; }

            bullets.push({ x: bx, y: by, dx: bdx, dy: bdy, size: 6 });
        }

        function spawnEnemy() {
            if (gameOver) return;
            let side = Math.floor(Math.random() * 4);
            let ex = 0, ey = 0;
            if (side === 0) { ex = Math.random() * (canvas.width - 32); ey = -40; }
            else if (side === 1) { ex = Math.random() * (canvas.width - 32); ey = canvas.height + 40; }
            else if (side === 2) { ex = -40; ey = Math.random() * (canvas.height - 32); }
            else { ex = canvas.width + 40; ey = Math.random() * (canvas.height - 32); }

            enemies.push({
                x: ex,
                y: ey,
                size: 32,
                speed: 1 + (level * 0.2),
                dir: 'DOWN'
            });
        }

        setInterval(spawnEnemy, 2500);

        function resetGame() {
            score = 0;
            lives = 3;
            level = 1;
            gameTime = 0;
            gameOver = false;
            enemies = [];
            bullets = [];
            enemyBullets = [];
            player.x = 235;
            player.y = 235;
            scoreEl.innerText = score;
            levelEl.innerText = level;
            livesEl.innerText = '❤️❤️❤️';
        }

        function update() {
            if (gameOver) return;

            if ((keys['KeyW'] || keys['ArrowUp']) && player.y > 0) { player.y -= player.speed; player.dir = 'UP'; }
            if ((keys['KeyS'] || keys['ArrowDown']) && player.y < canvas.height - player.size) { player.y += player.speed; player.dir = 'DOWN'; }
            if ((keys['KeyA'] || keys['ArrowLeft']) && player.x > 0) { player.x -= player.speed; player.dir = 'LEFT'; }
            if ((keys['KeyD'] || keys['ArrowRight']) && player.x < canvas.width - player.size) { player.x += player.speed; player.dir = 'RIGHT'; }

            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.x += b.dx;
                b.y += b.dy;

                if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
                    bullets.splice(i, 1);
                    continue;
                }

                for (let j = enemies.length - 1; j >= 0; j--) {
                    let e = enemies[j];
                    if (b.x < e.x + e.size && b.x + b.size > e.x && b.y < e.y + e.size && b.y + b.size > e.y) {
                        enemies.splice(j, 1);
                        bullets.splice(i, 1);
                        score += 10;
                        scoreEl.innerText = score;
                        if (score > highscore) {
                            highscore = score;
                            highscoreEl.innerText = highscore;
                            localStorage.setItem('tank_highscore', highscore);
                        }
                        break;
                    }
                }
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                let exC = e.x + e.size / 2;
                let eyC = e.y + e.size / 2;
                let pxC = player.x + player.size / 2;
                let pyC = player.y + player.size / 2;

                if (Math.abs(pxC - exC) > Math.abs(pyC - eyC)) {
                    e.dir = pxC > exC ? 'RIGHT' : 'LEFT';
                } else {
                    e.dir = pyC > eyC ? 'DOWN' : 'UP';
                }

                if (e.dir === 'UP') e.y -= e.speed;
                if (e.dir === 'DOWN') e.y += e.speed;
                if (e.dir === 'LEFT') e.x -= e.speed;
                if (e.dir === 'RIGHT') e.x += e.speed;

                if (Math.random() < 0.008 + (level * 0.002)) {
                    let ebx = 0, eby = 0, ebdx = 0, ebdy = 0;
                    let bSpeed = 3 + level * 0.4;
                    let ecx = e.x + e.size / 2;
                    let ecy = e.y + e.size / 2;

                    if (e.dir === 'UP') { ebx = ecx - 3; eby = e.y - 10; ebdy = -bSpeed; }
                    else if (e.dir === 'DOWN') { ebx = ecx - 3; eby = e.y + e.size; ebdy = bSpeed; }
                    else if (e.dir === 'LEFT') { ebx = e.x - 10; eby = ecy - 3; ebdx = -bSpeed; }
                    else if (e.dir === 'RIGHT') { ebx = e.x + e.size; eby = ecy - 3; ebdx = bSpeed; }

                    enemyBullets.push({ x: ebx, y: eby, dx: ebdx, dy: ebdy, size: 6 });
                }
            }

            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                let eb = enemyBullets[i];
                eb.x += eb.dx;
                eb.y += eb.dy;

                if (eb.x < 0 || eb.x > canvas.width || eb.y < 0 || eb.y > canvas.height) {
                    enemyBullets.splice(i, 1);
                    continue;
                }

                if (eb.x < player.x + player.size && eb.x + eb.size > player.x && eb.y < player.y + player.size && eb.y + eb.size > player.y) {
                    enemyBullets.splice(i, 1);
                    lives--;
                    updateLivesDisplay();
                    if (lives <= 0) gameOver = true;
                }
            }
        }

        function updateLivesDisplay() {
            let h = '';
            for (let i = 0; i < lives; i++) h += '❤️';
            livesEl.innerText = h;
        }

        function drawTank(x, y, dir, isPlayer) {
            ctx.fillStyle = isPlayer ? '#000000' : '#111111';
            ctx.fillRect(x, y, 32, 32);

            ctx.fillStyle = isPlayer ? '#4CAF50' : '#ff4444';
            if (dir === 'UP') ctx.fillRect(x + 13, y - 10, 6, 12);
            if (dir === 'DOWN') ctx.fillRect(x + 13, y + 30, 6, 12);
            if (dir === 'LEFT') ctx.fillRect(x - 10, y + 13, 12, 6);
            if (dir === 'RIGHT') ctx.fillRect(x + 30, y + 13, 12, 6);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawTank(player.x, player.y, player.dir, true);

            for (let e of enemies) {
                drawTank(e.x, e.y, e.dir, false);
            }

            ctx.fillStyle = '#00aa00';
            for (let b of bullets) ctx.fillRect(b.x, b.y, b.size, b.size);

            ctx.fillStyle = '#ff1111';
            for (let eb of enemyBullets) ctx.fillRect(eb.x, eb.y, eb.size, eb.size);

            if (gameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ff4444';
                ctx.font = 'bold 24px "Courier New"';
                ctx.textAlign = 'center';
                ctx.fillText('FIM DE JOGO', canvas.width / 2, canvas.height / 2 - 20);
                ctx.fillStyle = '#ffffff';
                ctx.font = '14px "Courier New"';
                ctx.fillText('Clique ou Pressione ESPAÇO para Recomeçar', canvas.width / 2, canvas.height / 2 + 20);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
