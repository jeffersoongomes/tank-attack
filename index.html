<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tank Attack</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #121212;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 {
            color: #4CAF50;
            font-size: 24px;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        .scoreboard {
            font-size: 16px;
            margin-bottom: 15px;
            font-weight: bold;
        }
        canvas {
            border: 4px solid #fff;
            background-color: #1a1a2e;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.3);
        }
        .controls-hint {
            margin-top: 15px;
            font-size: 13px;
            color: #aaa;
            text-align: center;
        }
        .mobile-controls {
            display: none;
            margin-top: 15px;
            gap: 10px;
        }
        .btn-ctrl {
            background: #333;
            color: #fff;
            border: 2px solid #fff;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
        }
        .btn-ctrl:active {
            background: #4CAF50;
        }
        @media (max-width: 768px) {
            .mobile-controls {
                display: flex;
            }
        }
    </style>
</head>
<body>

    <h1>• TANK ATTACK •    BY-@jeffersoongomes </h1>
    <div class="scoreboard">
        Vidas: <span id="lives">❤️❤️❤️</span> | Nível: <span id="level">1</span> | Pontos: <span id="score">0</span> | Recorde: <span id="highscore">0</span>
    </div>

    <canvas id="gameCanvas" width="500" height="500"></canvas>

    <div class="controls-hint">
        <b>WASD / Setas</b>: Mover | <b>Espaço / Clique</b>: Atirar
    </div>

    <div class="mobile-controls">
        <button class="btn-ctrl" onclick="movePlayer('UP')">⬆️</button>
        <button class="btn-ctrl" onclick="movePlayer('LEFT')">⬅️</button>
        <button class="btn-ctrl" onclick="movePlayer('RIGHT')">➡️</button>
        <button class="btn-ctrl" onclick="movePlayer('DOWN')">⬇️</button>
        <button class="btn-ctrl" onclick="shootBullet()" style="background: #b71c1c;">🔥 ATIRAR</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const scoreEl = document.getElementById('score');
        const highscoreEl = document.getElementById('highscore');
        const livesEl = document.getElementById('lives');
        const levelEl = document.getElementById('level');

        let score = 0;
        let highscore = localStorage.getItem('tank_highscore') || 0;
        highscoreEl.innerText = highscore;

        let lives = 3;
        let level = 1;
        let gameTime = 0;
        let gameOver = false;

        // Subida de nível a cada 60 segundos
        setInterval(() => {
            if (!gameOver) {
                gameTime++;
                if (gameTime % 60 === 0) {
                    level++;
                    levelEl.innerText = level;
                }
            }
        }, 1000);

        // Jogador
        let player = {
            x: 235,
            y: 235,
            size: 30,
            speed: 3,
            dir: 'UP'
        };

        let bullets = [];
        let enemies = [];
        let enemyBullets = [];

        let keys = {};
        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            if (e.code === 'Space') {
                shootBullet();
                e.preventDefault();
            }
        });
        window.addEventListener('keyup', e => { keys[e.code] = false; });

        function movePlayer(direction) {
            player.dir = direction;
            if (direction === 'UP' && player.y > 0) player.y -= player.speed * 4;
            if (direction === 'DOWN' && player.y < canvas.height - player.size) player.y += player.speed * 4;
            if (direction === 'LEFT' && player.x > 0) player.x -= player.speed * 4;
            if (direction === 'RIGHT' && player.x < canvas.width - player.size) player.x += player.speed * 4;
        }

        function shootBullet() {
            if (gameOver) {
                resetGame();
                return;
            }

            let bx = 0, by = 0;
            let bdx = 0, bdy = 0;
            let speed = 4;
            let centerX = player.x + player.size / 2;
            let centerY = player.y + player.size / 2;

            // Tiro sai exatamente da ponta do canhão
            if (player.dir === 'UP') {
                bx = centerX - 3;
                by = player.y - 10;
                bdy = -speed;
            } else if (player.dir === 'DOWN') {
                bx = centerX - 3;
                by = player.y + player.size + 4;
                bdy = speed;
            } else if (player.dir === 'LEFT') {
                bx = player.x - 10;
                by = centerY - 3;
                bdx = -speed;
            } else if (player.dir === 'RIGHT') {
                bx = player.x + player.size + 4;
                by = centerY - 3;
                bdx = speed;
            }

            bullets.push({ x: bx, y: by, dx: bdx, dy: bdy, size: 6 });
        }
