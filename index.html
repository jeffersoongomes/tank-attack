<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tank Attack</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #121212;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 {
            color: #4CAF50;
            font-size: 24px;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        .scoreboard {
            font-size: 16px;
            margin-bottom: 15px;
            font-weight: bold;
        }
        canvas {
            border: 4px solid #fff;
            background-color: #1a1a2e;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.3);
        }
        .controls-hint {
            margin-top: 15px;
            font-size: 13px;
            color: #aaa;
            text-align: center;
        }
        .mobile-controls {
            display: none;
            margin-top: 15px;
            gap: 10px;
        }
        .btn-ctrl {
            background: #333;
            color: #fff;
            border: 2px solid #fff;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
        }
        .btn-ctrl:active {
            background: #4CAF50;
        }
        @media (max-width: 768px) {
            .mobile-controls {
                display: flex;
            }
        }
    </style>
</head>
<body>

    <h1>• TANK ATTACK •</h1>
    <div class="scoreboard">
        Vidas: <span id="lives">❤️❤️❤️</span> | Nível: <span id="level">1</span> | Pontos: <span id="score">0</span> | Recorde: <span id="highscore">0</span>
    </div>

    <canvas id="gameCanvas" width="500" height="500"></canvas>

    <div class="controls-hint">
        <b>WASD / Setas</b>: Mover | <b>Espaço / Clique</b>: Atirar
    </div>

    <div class="mobile-controls">
        <button class="btn-ctrl" onclick="movePlayer('UP')">⬆️</button>
        <button class="btn-ctrl" onclick="movePlayer('LEFT')">⬅️</button>
        <button class="btn-ctrl" onclick="movePlayer('RIGHT')">➡️</button>
        <button class="btn-ctrl" onclick="movePlayer('DOWN')">⬇️</button>
        <button class="btn-ctrl" onclick="shootBullet()" style="background: #b71c1c;">🔥 ATIRAR</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const scoreEl = document.getElementById('score');
        const highscoreEl = document.getElementById('highscore');
        const livesEl = document.getElementById('lives');
        const levelEl = document.getElementById('level');

        let score = 0;
        let highscore = localStorage.getItem('tank_highscore') || 0;
        highscoreEl.innerText = highscore;

        let lives = 3;
        let level = 1;
        let gameTime = 0;
        let gameOver = false;

        // Subida de nível a cada 60 segundos
        setInterval(() => {
            if (!gameOver) {
                gameTime++;
                if (gameTime % 60 === 0) {
                    level++;
                    levelEl.innerText = level;
                }
            }
        }, 1000);

        // Jogador
        let player = {
            x: 235,
            y: 235,
            size: 30,
            speed: 3,
            dir: 'UP'
        };

        let bullets = [];
        let enemies = [];
        let enemyBullets = [];

        let keys = {};
        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            if (e.code === 'Space') {
                shootBullet();
                e.preventDefault();
            }
        });
        window.addEventListener('keyup', e => { keys[e.code] = false; });

        function movePlayer(direction) {
            player.dir = direction;
            if (direction === 'UP' && player.y > 0) player.y -= player.speed * 4;
            if (direction === 'DOWN' && player.y < canvas.height - player.size) player.y += player.speed * 4;
            if (direction === 'LEFT' && player.x > 0) player.x -= player.speed * 4;
            if (direction === 'RIGHT' && player.x < canvas.width - player.size) player.x += player.speed * 4;
        }

        function shootBullet() {
            if (gameOver) {
                resetGame();
                return;
            }

            let bx = 0, by = 0;
            let bdx = 0, bdy = 0;
            let speed = 7;
            let cannonLength = 22; // Distância do centro até à ponta do canhão
            let centerX = player.x + player.size / 2;
            let centerY = player.y + player.size / 2;

            // Posição EXATA da ponta do bico do canhão
            if (player.dir === 'UP') {
                bx = centerX - 3;
                by = centerY - cannonLength;
                bdy = -speed;
            } else if (player.dir === 'DOWN') {
                bx = centerX - 3;
                by = centerY + cannonLength - 6;
                bdy = speed;
            } else if (player.dir === 'LEFT') {
                bx = centerX - cannonLength;
                by = centerY - 3;
                bdx = -speed;
            } else if (player.dir === 'RIGHT') {
                bx = centerX + cannonLength - 6;
                by = centerY - 3;
                bdx = speed;
            }

            bullets.push({ x: bx, y: by, dx: bdx, dy: bdy, size: 6 });
        }

        function spawnEnemy() {
            if (gameOver) return;
            let side = Math.floor(Math.random() * 4);
            let ex = 0, ey = 0;
            if (side === 0) { ex = Math.random() * (canvas.width - 30); ey = -30; }
            else if (side === 1) { ex = Math.random() * (canvas.width - 30); ey = canvas.height + 30; }
            else if (side === 2) { ex = -30; ey = Math.random() * (canvas.height - 30); }
            else { ex = canvas.width + 30; ey = Math.random() * (canvas.height - 30); }

            enemies.push({ x: ex, y: ey, size: 30, speed: 1 + (level * 0.2), angle: 0 });
        }

        setInterval(spawnEnemy, 2500);

        function resetGame() {
            score = 0;
            lives = 3;
            level = 1;
            gameTime = 0;
            gameOver = false;
            enemies = [];
            bullets = [];
            enemyBullets = [];
            player.x = 235;
            player.y = 235;
            scoreEl.innerText = score;
            levelEl.innerText = level;
            livesEl.innerText = '❤️❤️❤️';
        }

        function update() {
            if (gameOver) return;

            // Movimento do Jogador
            if ((keys['KeyW'] || keys['ArrowUp']) && player.y > 0) { player.y -= player.speed; player.dir = 'UP'; }
            if ((keys['KeyS'] || keys['ArrowDown']) && player.y < canvas.height - player.size) { player.y += player.speed; player.dir = 'DOWN'; }
            if ((keys['KeyA'] || keys['ArrowLeft']) && player.x > 0) { player.x -= player.speed; player.dir = 'LEFT'; }
            if ((keys['KeyD'] || keys['ArrowRight']) && player.x < canvas.width - player.size) { player.x += player.speed; player.dir = 'RIGHT'; }

            // Balas do Jogador
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.x += b.dx;
                b.y += b.dy;

                if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
                    bullets.splice(i, 1);
                    continue;
                }

                // Destrói inimigo ao acertar
                for (let j = enemies.length - 1; j >= 0; j--) {
                    let e = enemies[j];
                    if (b.x < e.x + e.size && b.x + b.size > e.x && b.y < e.y + e.size && b.y + b.size > e.y) {
                        enemies.splice(j, 1);
                        bullets.splice(i, 1);
                        score += 10;
                        scoreEl.innerText = score;
                        if (score > highscore) {
                            highscore = score;
                            highscoreEl.innerText = highscore;
                            localStorage.setItem('tank_highscore', highscore);
                        }
                        break;
                    }
                }
            }

            // Inimigos
            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                let exCenter = e.x + e.size / 2;
                let eyCenter = e.y + e.size / 2;
                let pxCenter = player.x + player.size / 2;
                let pyCenter = player.y + player.size / 2;

                // Ângulo em direção ao jogador
                e.angle = Math.atan2(pyCenter - eyCenter, pxCenter - exCenter);

                e.x += Math.cos(e.angle) * e.speed;
                e.y += Math.sin(e.angle) * e.speed;

                // Tiro sai EXATAMENTE da ponta do canhão do inimigo
                if (Math.random() < 0.008 + (level * 0.002)) {
                    let cannonLength = 20;
                    let tipX = exCenter + Math.cos(e.angle) * cannonLength;
                    let tipY = eyCenter + Math.sin(e.angle) * cannonLength;
                    let bSpeed = 3 + level * 0.4;

                    enemyBullets.push({
                        x: tipX - 3,
                        y: tipY - 3,
                        dx: Math.cos(e.angle) * bSpeed,
                        dy: Math.sin(e.angle) * bSpeed,
                        size: 6
                    });
                }
            }

            // Balas Inimigas
            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                let eb = enemyBullets[i];
                eb.x += eb.dx;
                eb.y += eb.dy;

                if (eb.x < 0 || eb.x > canvas.width || eb.y < 0 || eb.y > canvas.height) {
                    enemyBullets.splice(i, 1);
                    continue;
                }

                // Dano ao jogador ao ser atingido pela bala
                if (eb.x < player.x + player.size && eb.x + eb.size
