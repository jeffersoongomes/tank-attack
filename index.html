<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tank Attack</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #121212;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 {
            color: #4CAF50;
            font-size: 24px;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        .scoreboard {
            font-size: 16px;
            margin-bottom: 15px;
            font-weight: bold;
        }
        canvas {
            border: 4px solid #fff;
            background-color: #1a1a2e;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.3);
        }
        .controls-hint {
            margin-top: 15px;
            font-size: 13px;
            color: #aaa;
            text-align: center;
        }
        .mobile-controls {
            display: none;
            margin-top: 15px;
            gap: 10px;
        }
        .btn-ctrl {
            background: #333;
            color: #fff;
            border: 2px solid #fff;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
        }
        .btn-ctrl:active {
            background: #4CAF50;
        }
        @media (max-width: 768px) {
            .mobile-controls {
                display: flex;
            }
        }
    </style>
</head>
<body>

    <h1>• TANK ATTACK •</h1>
    <div class="scoreboard">
        Vidas: <span id="lives">❤️❤️❤️</span> | Nível: <span id="level">1</span> | Pontos: <span id="score">0</span> | Recorde: <span id="highscore">0</span>
    </div>

    <canvas id="gameCanvas" width="500" height="500"></canvas>

    <div class="controls-hint">
        <b>WASD / Setas</b>: Mover | <b>Espaço / Clique</b>: Atirar
    </div>

    <div class="mobile-controls">
        <button class="btn-ctrl" onclick="movePlayer('UP')">⬆️</button>
        <button class="btn-ctrl" onclick="movePlayer('LEFT')">⬅️</button>
        <button class="btn-ctrl" onclick="movePlayer('RIGHT')">➡️</button>
        <button class="btn-ctrl" onclick="movePlayer('DOWN')">⬇️</button>
        <button class="btn-ctrl" onclick="shootBullet()" style="background: #b71c1c;">🔥 ATIRAR</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const scoreEl = document.getElementById('score');
        const highscoreEl = document.getElementById('highscore');
        const livesEl = document.getElementById('lives');
        const levelEl = document.getElementById('level');

        let score = 0;
        let highscore = localStorage.getItem('tank_highscore') || 0;
        highscoreEl.innerText = highscore;

        let lives = 3;
        let level = 1;
        let gameTime = 0;
        let gameOver = false;

        // Controlo de tempo para subida de nível a cada 60 segundos
        setInterval(() => {
            if (!gameOver) {
                gameTime++;
                if (gameTime % 60 === 0) {
                    level++;
                    levelEl.innerText = level;
                }
            }
        }, 1000);

        // Jogador (Tank Branco no centro)
        let player = {
            x: 235,
            y: 235,
            size: 30,
            speed: 3,
            dir: 'UP'
        };

        let bullets = [];
        let enemies = [];
        let enemyBullets = [];

        // Teclado
        let keys = {};
        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            if (e.code === 'Space') {
                shootBullet();
                e.preventDefault();
            }
        });
        window.addEventListener('keyup', e => { keys[e.code] = false; });

        function movePlayer(direction) {
            player.dir = direction;
            if (direction === 'UP' && player.y > 0) player.y -= player.speed * 4;
            if (direction === 'DOWN' && player.y < canvas.height - player.size) player.y += player.speed * 4;
            if (direction === 'LEFT' && player.x > 0) player.x -= player.speed * 4;
            if (direction === 'RIGHT' && player.x < canvas.width - player.size) player.x += player.speed * 4;
        }

        function shootBullet() {
            if (gameOver) {
                resetGame();
                return;
            }
            let bx = player.x + player.size / 2 - 4;
            let by = player.y + player.size / 2 - 4;
            let bdx = 0, bdy = 0;
            let speed = 6;

            if (player.dir === 'UP') bdy = -speed;
            if (player.dir === 'DOWN') bdy = speed;
            if (player.dir === 'LEFT') bdx = -speed;
            if (player.dir === 'RIGHT') bdx = speed;

            bullets.push({ x: bx, y: by, dx: bdx, dy: bdy, size: 8 });
        }

        // Criar Inimigos (Tanques Pretos nas bordas)
        function spawnEnemy() {
            if (gameOver) return;
            let side = Math.floor(Math.random() * 4);
            let ex = 0, ey = 0;
            if (side === 0) { ex = Math.random() * canvas.width; ey = -30; }
            else if (side === 1) { ex = Math.random() * canvas.width; ey = canvas.height + 30; }
            else if (side === 2) { ex = -30; ey = Math.random() * canvas.height; }
            else { ex = canvas.width + 30; ey = Math.random() * canvas.height; }

            enemies.push({ x: ex, y: ey, size: 30, speed: 1 + (level * 0.3) });
        }

        setInterval(spawnEnemy, 2500);

        function resetGame() {
            score = 0;
            lives = 3;
            level = 1;
            gameTime = 0;
            gameOver = false;
            enemies = [];
            bullets = [];
            enemyBullets = [];
            player.x = 235;
            player.y = 235;
            scoreEl.innerText = score;
            levelEl.innerText = level;
            livesEl.innerText = '❤️❤️❤️';
        }

        function update() {
            if (gameOver) return;

            // Movimento do Jogador
            if ((keys['KeyW'] || keys['ArrowUp']) && player.y > 0) { player.y -= player.speed; player.dir = 'UP'; }
            if ((keys['KeyS'] || keys['ArrowDown']) && player.y < canvas.height - player.size) { player.y += player.speed; player.dir = 'DOWN'; }
            if ((keys['KeyA'] || keys['ArrowLeft']) && player.x > 0) { player.x -= player.speed; player.dir = 'LEFT'; }
            if ((keys['KeyD'] || keys['ArrowRight']) && player.x < canvas.width - player.size) { player.x += player.speed; player.dir = 'RIGHT'; }

            // Atualizar Balas do Jogador
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.x += b.dx;
                b.y += b.dy;

                // Remover fora da tela
                if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
                    bullets.splice(i, 1);
                    continue;
                }

                // Colisão Bala vs Inimigo (destrói o tanque preto)
                for (let j = enemies.length - 1; j >= 0; j--) {
                    let e = enemies[j];
                    if (b.x < e.x + e.size && b.x + b.size > e.x && b.y < e.y + e.size && b.y + b.size > e.y) {
                        enemies.splice(j, 1);
                        bullets.splice(i, 1);
                        score += 10;
                        scoreEl.innerText = score;
                        if (score > highscore) {
                            highscore = score;
                            highscoreEl.innerText = highscore;
                            localStorage.setItem('tank_highscore', highscore);
                        }
                        break;
                    }
                }
            }

            // Atualizar Inimigos
            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                // Perseguir o jogador suavemente
                let angle = Math.atan2(player.y - e.y, player.x - e.x);
                e.x += Math.cos(angle) * e.speed;
                e.y += Math.sin(angle) * e.speed;

                // ATENÇÃO: A colisão direta com o tanque inimigo FOI REMOVIDA. Podes encostar nele à vontade!

                // Inimigos disparam ocasionalmente contra o jogador
                if (Math.random() < 0.01 + (level * 0.002)) {
                    let bAngle = Math.atan2(player.y - e.y, player.x - e.x);
                    enemyBullets.push({
                        x: e.x + e.size/2,
                        y: e.y + e.size/2,
                        dx: Math.cos(bAngle) * (3 + level * 0.5),
                        dy: Math.sin(bAngle) * (3 + level * 0.5),
                        size: 6
                    });
                }
            }

            // Atualizar Balas Inimigas (estas sim causam dano ao jogador)
            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                let eb = enemyBullets[i];
                eb.x += eb.dx;
                eb.y += eb.dy;

                if (eb.x < 0 || eb.x > canvas.width || eb.y < 0 || eb.y > canvas.height) {
                    enemyBullets.splice(i, 1);
                    continue;
                }

                // Colisão da bala inimiga com o jogador
                if (eb.x < player.x + player.size && eb.x + eb.size > player.x && eb.y < player.y + player.size && eb.y + eb.size > player.y) {
                    enemyBullets.splice(i, 1);
                    lives--;
                    updateLivesDisplay();
                    if (lives <= 0) {
                        gameOver = true;
                    }
                }
            }
        }

        function updateLivesDisplay() {
            let hearts = '';
            for (let i = 0; i < lives; i++) hearts += '❤️';
            livesEl.innerText = hearts;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Desenhar Jogador (Branco)
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(player.x, player.y, player.size, player.size);
            // Canhão do jogador
            ctx.fillStyle = '#cccccc';
            if (player.dir === 'UP') ctx.fillRect(player.x + 11, player.y - 10, 8, 12);
            if (player.dir === 'DOWN') ctx.fillRect(player.x + 11, player.y + 28, 8, 12);
            if (player.dir === 'LEFT') ctx.fillRect(player.x - 10, player.y + 11, 12, 8);
            if (player.dir === 'RIGHT') ctx.fillRect(player.x + 28, player.y + 11, 12, 8);

            // Desenhar Inimigos (Pretos com bordas brancas para destacar)
            ctx.fillStyle = '#111111';
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            for (let e of enemies) {
                ctx.fillRect(e.x, e.y, e.size, e.size);
                ctx.strokeRect(e.x, e.y, e.size, e.size);
            }

            // Desenhar Balas do Jogador (Brancas)
            ctx.fillStyle = '#ffffff';
            for (let b of bullets) {
                ctx.fillRect(b.x, b.y, b.size, b.size);
            }

            // Desenhar Balas Inimigas (Vermelhas para avisar o perigo)
            ctx.fillStyle = '#ff4444';
            for (let eb of enemyBullets) {
                ctx.fillRect(eb.x, eb.y, eb.size, eb.size);
            }

            // Tela de Game Over
            if (gameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ff4444';
                ctx.font = 'bold 24px "Courier New"';
                ctx.textAlign = 'center';
                ctx.fillText('FIM DE JOGO', canvas.width / 2, canvas.height / 2 - 20);
                ctx.fillStyle = '#ffffff';
                ctx.font = '14px "Courier New"';
                ctx.fillText('Clique ou Pressione ESPAÇO para Recomeçar', canvas.width / 2, canvas.height / 2 + 20);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
